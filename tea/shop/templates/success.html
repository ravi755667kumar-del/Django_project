{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - Brew Haven</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        /* ── Success page background ── */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fce8d5;
            padding: 20px;
        }

        .success-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 55px 45px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .success-icon {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #2d6a4f, #1dd1a1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            margin: 0 auto 25px;
            box-shadow: 0 8px 25px rgba(29, 209, 161, 0.4);
            animation: scaleIn 0.4s 0.3s ease both;
        }

        .success-card h2 {
            font-size: 28px;
            font-weight: 800;
            color: #1a3a28;
            margin-bottom: 15px;
        }

        .success-card p {
            color: #555;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .order-more-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2d6a4f, #1dd1a1);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            border-radius: 50px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(29, 209, 161, 0.35);
        }
        .order-more-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(29, 209, 161, 0.5);
        }

        .confetti-line {
            font-size: 28px;
            letter-spacing: 8px;
            margin-bottom: 20px;
            animation: shake 0.5s 0.6s ease both;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.85) translateY(30px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes scaleIn {
            from { transform: scale(0); }
            to   { transform: scale(1); }
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25%     { transform: translateX(-5px); }
            75%     { transform: translateX(5px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .success-card { padding: 35px 22px; }
            .success-card h2 { font-size: 22px; }
            .success-icon { width: 72px; height: 72px; font-size: 32px; }
        }
    </style>
</head>
<body>
    <div class="success-card">

        <div class="confetti-line">🎊 🍵 🎉</div>

        <div class="success-icon">✅</div>

        <h2>Order Confirmed!</h2>

        <p>
            Thank you for choosing <strong>Brew Haven</strong>. 🌿<br>
            Your tea is being freshly prepared and will be ready shortly.
            Sit back, relax and enjoy!
        </p>

        <a href="{% url 'menu' %}" class="order-more-btn">
            🍵 Order More
        </a>

    </div>

    <script>
        // Clear cart after successful order
        localStorage.removeItem("cart");
    </script>
</body>
</html>
