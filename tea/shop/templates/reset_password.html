{% extends 'base.html' %}
{% load static %}

{% block body_class %}auth-mode{% endblock %}

{% block content %}
<div class="login-page">
    <header>
        <div class="logo">
            <img src="{% static 'images/header.jpg' %}" alt="Logo" width="80" height="80">
        </div>
        <nav id="main-nav">
            <a href="{% url 'login' %}">Back to Login</a>
        </nav>
    </header>

    <div class="login-body" style="display:flex; justify-content:center; align-items:center; height:100vh;">
        <div class="glass-panel form-wrapper fade-in" style="position:relative; width:100%; max-width:400px; padding:40px;">
            <h2>Reset Password</h2>
            
            {% if error %}
                <div class="error-msg" style="color:#e99e95; text-align:center; margin-bottom:20px; font-size:14px; padding:10px; background:#ffeaea; border-radius:8px;">
                    ⚠️ {{ error }}
                </div>
            {% endif %}

            {% if token and uidb64 %}
                <form method="POST" action="{% url 'reset_password' uidb64=uidb64 token=token %}">
                    {% csrf_token %}
                    <div class="input-group">
                        <input type="password" id="newPassword" name="new_password" required>
                        <label for="newPassword">New Password</label>
                    </div>
                    <div class="input-group">
                        <input type="password" id="rePassword" name="re_password" required>
                        <label for="rePassword">Re-enter Password</label>
                    </div>
                    <button type="submit" class="btn" style="margin-top:20px;">Update Password</button>
                </form>
            {% else %}
                <p style="text-align:center; margin-top:20px;">
                    <a href="{% url 'login' %}" style="color:#1dd1a1; text-decoration:none; font-weight:bold;">Return to Login</a>
                </p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
