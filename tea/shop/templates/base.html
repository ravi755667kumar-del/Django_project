{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brew Haven</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    {% block extra_css %}
    {% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">
    <!-- Background Music Removed -->

    {% block content %}
    {% endblock %}

    <script>
        // Provide authentication state and backend cart to Javascript
        const IS_LOGGED_IN = {% if request.session.customer_id %}true{% else %}false{% endif %};
        // Server cart data (defaults to empty array if none exists)
        const SERVER_CART = {{ request.session.cart_data|default:"[]"|safe }};
    </script>
    <script src="{% static 'js/script.js' %}" defer></script>

    {% block extra_scripts %}
    {% endblock %}

</body>
</html>
